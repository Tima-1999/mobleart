<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobleArt | Ussa Yönetim Paneli</title>
    
    <!-- Google Fonts ve Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #161616;
            --text-color: #e5e5e5;
            --text-muted: #aaa;
            --border-color: #262626;
            --header-bg: rgba(15, 15, 15, 0.95);
            --accent-color: #d4af37;
            --accent-hover: #e6c555;
            --input-bg: #0f0f0f;
        }

        [data-theme="light"] {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #222222;
            --text-muted: #666666;
            --border-color: #e2e8f0;
            --header-bg: rgba(248, 249, 250, 0.95);
            --accent-color: #b89728;
            --accent-hover: #997c1d;
            --input-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 22px; font-weight: 700; color: var(--text-color); }
        .logo span { color: var(--accent-color); }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        
        .control-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-btn:hover { background: var(--accent-color); color: #111; }

        .back-home { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .back-home:hover { color: var(--accent-color); }

        .admin-container { max-width: 950px; margin: 40px auto; padding: 0 20px; }
        .admin-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 30px; margin-bottom: 40px; }
        .admin-card h2 { font-size: 22px; margin-bottom: 20px; color: var(--text-color); display: flex; align-items: center; gap: 10px; }
        .admin-card h2 i { color: var(--accent-color); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-color); font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 5px; font-size: 14px; }
        
        .image-input-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .file-upload-btn { background: var(--border-color); color: var(--text-color); padding: 12px 18px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
        .file-upload-btn:hover { background: var(--accent-color); color: #111; }
        #imageFile { display: none; }

        .btn { background: var(--accent-color); color: #111; padding: 12px 25px; border-radius: 5px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn:hover { background: var(--accent-hover); }
        .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; }
        .btn-danger:hover { background: #dc2626; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; color: var(--text-color); vertical-align: middle; }
        th { color: var(--text-muted); font-weight: 600; background: var(--input-bg); }
        
        .prod-thumb-container {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .prod-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #statusMessage { margin-top: 15px; font-size: 14px; font-weight: 500; }

        /* Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .close-modal {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover { color: var(--accent-color); }
    </style>
</head>
<body>

    <header>
        <div class="logo">Moble<span>Art</span> Ussa Panel</div>
        <div class="header-actions">
            <button class="control-btn" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langText">TK / TR</span></button>
            <button class="control-btn" id="themeToggleBtn"><i class="fas fa-moon" id="themeIcon"></i></button>
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> <span data-tr="Siteye Dön" data-tk="Saýta gaýdyp bar">Saýta gaýdyp bar</span></a>
        </div>
    </header>

    <div class="admin-container">
        <!-- 1. Katalog üçin Täze Mebel / Ýygyndy Goşmak Formy -->
        <div class="admin-card">
            <h2><i class="fas fa-plus-circle"></i> <span data-tr="Kataloğa Yeni Mebel Ekle" data-tk="Kataloga Täze Mebel Goş">Kataloga Täze Mebel Goş</span></h2>
            <form id="addProductForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Mebeliň ady" data-tk="Mebeliň ady">Mebeliň ady</label>
                        <input type="text" id="prodTitle" placeholder="Mysal üçin: Klasika Myhmanhana Stoly" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Kategoriýasy" data-tk="Kategoriýasy">Kategoriýasy</label>
                        <select id="prodCategory" required>
                            <option value="Stol / Masa">Stol / Masa</option>
                            <option value="Oturgyç / Sandalye">Oturgyç / Sandalye</option>
                            <option value="Aşhana / Mutfak">Aşhana / Mutfak Mebeli</option>
                            <option value="Yatak / Ýatylýan oturgyç">Ýatylýan otag / Yatak Odası</option>
                            <option value="Beýleki / Diğer">Beýleki / Diğer</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Baha (TL / TMT)" data-tk="Bahasy (Takmynan)">Baha (Takmynan)</label>
                        <input type="number" id="prodPrice" placeholder="4500" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Ammardaky mukdary" data-tk="Ammardaky mukdary">Ammardaky / Sergideki sany</label>
                        <input type="number" id="prodStock" placeholder="1" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Materialy / Reňki" data-tk="Materialy / Reňki">Materialy / Reňki (Akaç, MDF...)</label>
                        <input type="text" id="prodMaterial" placeholder="Ýewropa agajy, Goýy goňur" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Ölçegi" data-tk="Ölçegi">Ölçegi (Uzunlygy x Ini)</label>
                        <input type="text" id="prodSize" placeholder="200x100 sm" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-tr="Surat (URL ýa-da kompýuterden)" data-tk="Surat (URL ýa-da kompýuterden saýla)">Surat (URL ýa-da kompýuterden saýla)</label>
                    <div class="image-input-box">
                        <input type="url" id="prodImage" placeholder="https://..." style="flex: 1;" required>
                        <label for="imageFile" class="file-upload-btn">
                            <i class="fas fa-image"></i> <span data-tr="Surat Saýla" data-tk="Surat saýla">Surat saýla</span>
                        </label>
                        <input type="file" id="imageFile" accept="image/*">
                    </div>
                </div>

                <div class="form-group">
                    <label data-tr="Düşündiriş / Jikme-jiklik" data-tk="Düşündiriş / Jikme-jiklik">Düşündiriş / Jikme-jiklik (Ussahanadan bellikler)</label>
                    <textarea id="prodDesc" rows="3" placeholder="Örän berk we hilli ýasalan..." required></textarea>
                </div>
                
                <button type="submit" class="btn" id="submitBtn"><i class="fas fa-upload"></i> <span data-tr="Mebeli Ýazga Al" data-tk="Mebeli ýazga al">Mebeli ýazga al</span></button>
                <div id="statusMessage"></div>
            </form>
        </div>

        <!-- 2. Bar bolan Mebeller we Ammar Tablisasy -->
        <div class="admin-card">
            <h2><i class="fas fa-boxes"></i> <span data-tr="Katalogdaky Mebeller" data-tk="Katalogdaky Mebeller">Katalogdaky Mebeller</span></h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th data-tr="Surat" data-tk="Surat">Surat</th>
                            <th data-tr="Mebel Maglumatlary" data-tk="Mebel Maglumatlary">Mebel Maglumatlary</th>
                            <th data-tr="Bahasy / Sany" data-tk="Bahasy / Sany">Bahasy / Sany</th>
                            <th data-tr="Jikme-jiklik" data-tk="Jikme-jiklik">Jikme-jiklik</th>
                            <th data-tr="Hereket" data-tk="Hereket">Hereket</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsList">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-muted);" data-tr="Ýüklenýär..." data-tk="Ýüklenýär...">Ýüklenýär...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. Sargytlar we Müşderiler Bölümi (Ussa üçin zakaz ýazylýan ýer) -->
        <div class="admin-card">
            <h2><i class="fas fa-clipboard-list"></i> <span data-tr="Müşderi Sargytlary (Zakazlar)" data-tk="Müşderi Sargytlary (Zakazlar)">Müşderi Sargytlary (Zakazlar)</span></h2>
            
            <form id="addOrderForm" style="margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 25px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Müşderiniň ady" data-tk="Müşderiniň ady">Müşderiniň ady</label>
                        <input type="text" id="custName" placeholder="Aman Amanow" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Telefon belgisi" data-tk="Telefon belgisi">Telefon belgisi</label>
                        <input type="text" id="custPhone" placeholder="+993 62..." required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Sargyt edilen mebel" data-tk="Sargyt edilen mebel">Sargyt edilen mebel / Görnüşi</label>
                        <input type="text" id="orderItem" placeholder="Örite ölçegliaşhana mebeli" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Umumy bahasy" data-tk="Umumy bahasy">Umumy bahasy</label>
                        <input type="number" id="orderPrice" placeholder="12000" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Alnan pul (Preoplata)" data-tk="Alnan pul (Preoplata)">Alnan pul (Preoplata)</label>
                        <input type="number" id="orderPaid" placeholder="5000" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Ýagdaýy" data-tk="Ýagdaýy">Ýagdaýy (Taýýarlanýar / Gowşuryldy)</label>
                        <input type="text" id="orderStatus" value="Taýýarlanýar..." required>
                    </div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-plus"></i> <span data-tr="Sargydy Ýazga Al" data-tk="Sargydy ýazga al">Sargydy ýazga al</span></button>
            </form>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th data-tr="Müşderi" data-tk="Müşderi">Müşderi</th>
                            <th data-tr="Önüm / Zakaz" data-tk="Önüm / Zakaz">Önüm / Zakaz</th>
                            <th data-tr="Umumy / Alnan / Galgan" data-tk="Umumy / Alnan / Galgan">Umumy / Alnan / Galgan</th>
                            <th data-tr="Ýagdaýy" data-tk="Ýagdaýy">Ýagdaýy</th>
                            <th data-tr="Hereket" data-tk="Hereket">Hereket</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersList">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-muted);" data-tr="Ýüklenýär..." data-tk="Ýüklenýär...">Ýüklenýär...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <!-- Skriptler -->
    <script>
        const toggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        const langToggleBtn = document.getElementById('langToggleBtn');
        const langText = document.getElementById('langText');

        let currentLang = localStorage.getItem('mobleart_lang') || 'tk';
        const savedTheme = localStorage.getItem('mobleart_theme') || 'dark';

        htmlElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
        setLanguage(currentLang);

        toggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('mobleart_theme', newTheme);
            updateThemeIcon(newTheme);
        });

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'tr' ? 'tk' : 'tr';
            localStorage.setItem('mobleart_lang', currentLang);
            setLanguage(currentLang);
        });

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        }

        function setLanguage(lang) {
            langText.innerText = lang.toUpperCase() === 'TR' ? 'TÜRKÇE' : 'TÜRKMENÇE';
            document.querySelectorAll('[data-tr]').forEach(el => {
                if (el.getAttribute(`data-${lang}`)) {
                    el.innerText = el.getAttribute(`data-${lang}`);
                }
            });
        }

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.querySelector('.close-modal');

        function openModal(imgSrc) {
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        closeModal.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(e) {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDituAe7mzCIobhpko8NJFDFMmtANehUhs",
            authDomain: "mobleart-db.firebaseapp.com",
            projectId: "mobleart-db",
            storageBucket: "mobleart-db.firebasestorage.app",
            messagingSenderId: "53737008056",
            appId: "1:53737008056:web:ec06ad2b5d4fe0d79d7d4d",
            measurementId: "G-7NJ8ZKDZPW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('addProductForm');
        const statusMsg = document.getElementById('statusMessage');
        const listContainer = document.getElementById('adminProductsList');
        const imageFileInput = document.getElementById('imageFile');
        const prodImageInput = document.getElementById('prodImage');

        imageFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    prodImageInput.value = event.target.result;
                    statusMsg.style.color = "#22c55e";
                    statusMsg.innerHTML = currentLang === 'tk' ? "✓ Surat üstünlikli saýlandy!" : "✓ Görsel başarıyla seçildi!";
                }
                reader.readAsDataURL(file);
            }
        });

        async function fetchAdminProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">${currentLang === 'tk' ? 'Heniz bellige alnan mebel ýok.' : 'Henüz kayıtlı mobilya yok.'}</td></tr>`;
                    return;
                }

                listContainer.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const prod = documentSnap.data();
                    const id = documentSnap.id;
                    listContainer.innerHTML += `
                        <tr>
                            <td>
                                <div class="prod-thumb-container" onclick="openModal('${prod.image}')">
                                    <img src="${prod.image}" class="prod-thumb" alt="">
                                </div>
                            </td>
                            <td>
                                <strong>${prod.title}</strong><br>
                                <small style="color:var(--accent-color);">${prod.category || '-'}</small>
                            </td>
                            <td>
                                <span style="color:var(--accent-color); font-weight:600;">${prod.price || 0}</span><br>
                                <small style="color:#22c55e;">${currentLang === 'tk' ? 'Mukdary' : 'Stok'}: ${prod.stock || 0} sany</small>
                            </td>
                            <td>
                                <small><strong>Mat:</strong> ${prod.material || '-'}</small><br>
                                <small><strong>Ölçeg:</strong> ${prod.size || '-'}</small>
                            </td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteProduct('${id}')"><i class="fas fa-trash"></i> ${currentLang === 'tk' ? 'Poz' : 'Sil'}</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Ýalňyşlyk:", error);
                listContainer.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">Hata oluştu.</td></tr>`;
            }
        }

        fetchAdminProducts();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('prodTitle').value;
            const category = document.getElementById('prodCategory').value;
            const price = document.getElementById('prodPrice').value;
            const stock = document.getElementById('prodStock').value;
            const material = document.getElementById('prodMaterial').value;
            const size = document.getElementById('prodSize').value;
            const image = prodImageInput.value;
            const description = document.getElementById('prodDesc').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${currentLang === 'tk' ? 'Işlenilýär...' : 'İşleniyor...'}`;

            try {
                await addDoc(collection(db, "products"), {
                    title: title,
                    category: category,
                    price: price,
                    stock: stock,
                    material: material,
                    size: size,
                    image: image,
                    description: description,
                    createdAt: new Date()
                });
                statusMsg.style.color = "#22c55e";
                statusMsg.innerHTML = currentLang === 'tk' ? "✓ Mebel üstünlikli goşuldy!" : "✓ Mobilya başarıyla eklendi!";
                form.reset();
                fetchAdminProducts();
            } catch (error) {
                console.error("Ýalňyşlyk:", error);
                statusMsg.style.color = "#ef4444";
                statusMsg.innerHTML = "✕ Hata oluştu!";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fas fa-upload"></i> ${currentLang === 'tk' ? 'Mebeli ýazga al' : 'Mobilyayı Kaydet'}`;
            }
        });

        window.deleteProduct = async function(id) {
            const confirmMsg = currentLang === 'tk' ? "Bu mebeli pozmak isleýärsiňizmi?" : "Bu mobilyayı silmek istediğinize emin misiniz?";
            if (confirm(confirmMsg)) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    alert(currentLang === 'tk' ? "Pozuldy!" : "Silindi!");
                    fetchAdminProducts();
                } catch (error) {
                    alert("Hata oluştu.");
                }
            }
        }

        // Sargytlar we Zakazlar üçin
        const orderForm = document.getElementById('addOrderForm');
        const ordersListContainer = document.getElementById('adminOrdersList');

        async function fetchAdminOrders() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                if (querySnapshot.empty) {
                    ordersListContainer.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">${currentLang === 'tk' ? 'Hasaba alnan sargyt (zakaz) ýok.' : 'Kayıtlı sipariş yok.'}</td></tr>`;
                    return;
                }

                ordersListContainer.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const ord = documentSnap.data();
                    const id = documentSnap.id;
                    const kalan = Number(ord.price) - Number(ord.paid);
                    
                    ordersListContainer.innerHTML += `
                        <tr>
                            <td><strong>${ord.name}</strong><br><small style="color:var(--text-muted);">${ord.phone}</small></td>
                            <td>${ord.item}</td>
                            <td>
                                <span style="color:var(--accent-color);">${ord.price}</span><br>
                                <small style="color:#22c55e;">${currentLang === 'tk' ? 'Alnan' : 'Ödenen'}: ${ord.paid}</small><br>
                                <small style="color:#ef4444;">${currentLang === 'tk' ? 'Galgan' : 'Kalan'}: ${kalan}</small>
                            </td>
                            <td>${ord.status}</td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteOrder('${id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Ýalňyşlyk:", error);
            }
        }

        fetchAdminOrders();

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const item = document.getElementById('orderItem').value;
            const price = document.getElementById('orderPrice').value;
            const paid = document.getElementById('orderPaid').value;
            const status = document.getElementById('orderStatus').value;

            try {
                await addDoc(collection(db, "orders"), {
                    name: name,
                    phone: phone,
                    item: item,
                    price: price,
                    paid: paid,
                    status: status,
                    createdAt: new Date()
                });
                alert(currentLang === 'tk' ? "Zakaz üstünlikli goşuldy!" : "Sipariş başarıyla eklendi!");
                orderForm.reset();
                fetchAdminOrders();
            } catch (error) {
                alert("Hata oluştu / Ýalňyşlyk ýüze çykdy.");
            }
        });

        window.deleteOrder = async function(id) {
            const confirmMsg = currentLang === 'tk' ? "Bu zakazy pozmak isleýärsiňizmi?" : "Bu siparişi silmek istediğinize emin misiniz?";
            if (confirm(confirmMsg)) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                    fetchAdminOrders();
                } catch (error) {
                    alert("Hata oluştu.");
                }
            }
        }
    </script>
</body>
</html>
