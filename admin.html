<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobleArt | Yönetim Paneli (Admin)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #161616;
            --text-color: #e5e5e5;
            --text-muted: #aaa;
            --border-color: #262626;
            --header-bg: rgba(15, 15, 15, 0.95);
            --accent-color: #d4af37;
            --accent-hover: #e6c555;
            --input-bg: #0f0f0f;
        }

        [data-theme="light"] {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #222222;
            --text-muted: #666666;
            --border-color: #e2e8f0;
            --header-bg: rgba(248, 249, 250, 0.95);
            --accent-color: #b89728;
            --accent-hover: #997c1d;
            --input-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 22px; font-weight: 700; color: var(--text-color); }
        .logo span { color: var(--accent-color); }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        
        .control-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-btn:hover { background: var(--accent-color); color: #111; }

        .back-home { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .back-home:hover { color: var(--accent-color); }

        .admin-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .admin-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 30px; margin-bottom: 40px; }
        .admin-card h2 { font-size: 22px; margin-bottom: 20px; color: var(--text-color); display: flex; align-items: center; gap: 10px; }
        .admin-card h2 i { color: var(--accent-color); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-color); font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 5px; font-size: 14px; }
        
        .image-input-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .file-upload-btn { background: var(--border-color); color: var(--text-color); padding: 12px 18px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
        .file-upload-btn:hover { background: var(--accent-color); color: #111; }
        #imageFile { display: none; }

        .btn { background: var(--accent-color); color: #111; padding: 12px 25px; border-radius: 5px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn:hover { background: var(--accent-hover); }
        .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; }
        .btn-danger:hover { background: #dc2626; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; color: var(--text-color); vertical-align: middle; }
        th { color: var(--text-muted); font-weight: 600; background: var(--input-bg); }
        
        .prod-thumb-container {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .prod-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #statusMessage { margin-top: 15px; font-size: 14px; font-weight: 500; }

        /* Login Screen Overlay */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-box h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        /* Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .close-modal {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover { color: var(--accent-color); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>Moble<span>Art</span> <span data-tr="Yönetici Girişi" data-tk="Admin Girişi">Admin Girişi</span></h2>
            <form id="loginForm">
                <div class="form-group">
                    <label data-tr="E-Posta Adresi" data-tk="E-poçta salgysy">E-Posta Adresi</label>
                    <input type="email" id="loginEmail" placeholder="admin@mobleart.com" required>
                </div>
                <div class="form-group">
                    <label data-tr="Şifre" data-tk="Parol">Şifre</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; justify-content: center;" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> <span data-tr="Giriş Yap" data-tk="Girmek">Giriş Yap</span>
                </button>
                <div id="loginError" style="color: #ef4444; margin-top: 10px; font-size: 13px; text-align: center;"></div>
            </form>
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" class="back-home" style="justify-content: center;"><i class="fas fa-arrow-left"></i> <span data-tr="Siteye Dön" data-tk="Saýta gaýdyp bar">Siteye Dön</span></a>
            </div>
        </div>
    </div>

    <header>
        <div class="logo">Moble<span>Art</span> Admin</div>
        <div class="header-actions">
            <button class="control-btn" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langText">TK / TR</span></button>
            <button class="control-btn" id="themeToggleBtn"><i class="fas fa-moon" id="themeIcon"></i></button>
            <button class="control-btn" id="logoutBtn" style="border-color: #ef4444; color: #ef4444;"><i class="fas fa-sign-out-alt"></i> <span data-tr="Çıkış" data-tk="Çykmak">Çıkış</span></button>
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> <span data-tr="Siteye Dön" data-tk="Saýta gaýdyp bar">Siteye Dön</span></a>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-card">
            <h2><i class="fas fa-plus-circle"></i> <span data-tr="Yeni Ürün / Tasarım Ekle" data-tk="Täze önüm / dizaýn goş">Yeni Ürün / Tasarım Ekle</span></h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label data-tr="Ürün Başlığı" data-tk="Önümiň ady">Ürün Başlığı</label>
                    <input type="text" id="prodTitle" placeholder="Örn: Lüks Mutfak Dolabı" required>
                </div>
                
                <div class="form-group">
                    <label data-tr="Görsel (URL veya Bilgisayardan Seç)" data-tk="Surat (URL ýa-da kompýuterden saýla)">Görsel (URL veya Bilgisayardan Seç)</label>
                    <div class="image-input-box">
                        <input type="url" id="prodImage" placeholder="https://..." style="flex: 1;" required>
                        <label for="imageFile" class="file-upload-btn">
                            <i class="fas fa-image"></i> <span data-tr="Surat Seç" data-tk="Surat saýla">Surat Seç</span>
                        </label>
                        <input type="file" id="imageFile" accept="image/*">
                    </div>
                </div>

                <div class="form-group">
                    <label data-tr="Açıklama" data-tk="Düşündiriş">Açıklama</label>
                    <textarea id="prodDesc" rows="3" placeholder="Ürün hakkında kısa bilgi..." required></textarea>
                </div>
                
                <button type="submit" class="btn" id="submitBtn"><i class="fas fa-upload"></i> <span data-tr="Ürünü Yayınla" data-tk="Önümi çap et">Ürünü Yayınla</span></button>
                <div id="statusMessage"></div>
            </form>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-boxes"></i> <span data-tr="Mevcut Ürünleri Yönet" data-tk="Bar bolan önümleri dolandyr">Mevcut Ürünleri Yönet</span></h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th data-tr="Görsel" data-tk="Surat">Görsel</th>
                            <th data-tr="Başlık" data-tk="Ady">Başlık</th>
                            <th data-tr="İşlem" data-tk="Hereket">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsList">
                        <tr><td colspan="3" style="text-align: center; color: var(--text-muted);" data-tr="Yükleniyor..." data-tk="Ýüklenýär...">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-clipboard-list"></i> <span data-tr="Sipariş ve Müşteri Takibi" data-tk="Sargytlar we Müşderi Yzarlamak">Sipariş ve Müşteri Takibi</span></h2>
            
            <form id="addOrderForm" style="margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 25px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Müşteri Adı" data-tk="Müşderiniň ady">Müşteri Adı</label>
                        <input type="text" id="custName" placeholder="Aman Amanow" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Telefon" data-tk="Telefon belgisi">Telefon</label>
                        <input type="text" id="custPhone" placeholder="+90 555..." required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Mobilya / Ürün" data-tk="Sargyt eden mebeli">Mobilya / Ürün</label>
                        <input type="text" id="orderItem" placeholder="Lüks Mutfak Dolabı" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label data-tr="Toplam Fiyat (TL)" data-tk="Umumy bahasy (TL)">Toplam Fiyat (TL)</label>
                        <input type="number" id="orderPrice" placeholder="15000" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Ödenen (Kapora)" data-tk="Alnan pul (Preoplata)">Ödenen (Kapora)</label>
                        <input type="number" id="orderPaid" placeholder="10000" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label data-tr="Durum" data-tk="Ýagdaýy">Durum</label>
                        <input type="text" id="orderStatus" placeholder="Hazırlanıyor / Taýýarlanýar" value="Hazırlanıyor / Taýýarlanýar" required>
                    </div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-plus"></i> <span data-tr="Siparişi Kaydet" data-tk="Sargydy ýazga al">Siparişi Kaydet</span></button>
            </form>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th data-tr="Müşteri" data-tk="Müşderi">Müşteri</th>
                            <th data-tr="Ürün" data-tk="Önüm">Ürün</th>
                            <th data-tr="Toplam/Ödenen/Kalan" data-tk="Umumy/Alnan/Galgan">Toplam/Ödenen/Kalan</th>
                            <th data-tr="Durum" data-tk="Ýagdaýy">Durum</th>
                            <th data-tr="İşlem" data-tk="Hereket">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersList">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-muted);" data-tr="Yükleniyor..." data-tk="Ýüklenýär...">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        const toggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        const langToggleBtn = document.getElementById('langToggleBtn');
        const langText = document.getElementById('langText');

        let currentLang = localStorage.getItem('mobleart_lang') || 'tr';
        const savedTheme = localStorage.getItem('mobleart_theme') || 'dark';

        htmlElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
        setLanguage(currentLang);

        toggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('mobleart_theme', newTheme);
            updateThemeIcon(newTheme);
        });

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'tr' ? 'tk' : 'tr';
            localStorage.setItem('mobleart_lang', currentLang);
            setLanguage(currentLang);
        });

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        }

        function setLanguage(lang) {
            langText.innerText = lang.toUpperCase() === 'TR' ? 'TURKMENÇE' : 'TÜRKÇE';
            document.querySelectorAll('[data-tr]').forEach(el => {
                if (el.getAttribute(`data-${lang}`)) {
                    el.innerText = el.getAttribute(`data-${lang}`);
                }
            });
        }

        // Modal Açma Funksiýasy
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.querySelector('.close-modal');

        function openModal(imgSrc) {
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        closeModal.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(e) {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDituAe7mzCIobhpko8NJFDFMmtANehUhs",
            authDomain: "mobleart-db.firebaseapp.com",
            projectId: "mobleart-db",
            storageBucket: "mobleart-db.firebasestorage.app",
            messagingSenderId: "53737008056",
            appId: "1:53737008056:web:ec06ad2b5d4fe0d79d7d4d",
            measurementId: "G-7NJ8ZKDZPW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const loginOverlay = document.getElementById('loginOverlay');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        // Ulanyjynyň giriş ýagdaýyny barlamak
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginOverlay.style.display = 'none';
                fetchAdminProducts();
                fetchAdminOrders();
            } else {
                loginOverlay.style.display = 'flex';
            }
        });

        // Giriş etmek (Login)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginError.innerText = "";
                loginForm.reset();
            } catch (error) {
                loginError.innerText = currentLang === 'tk' ? "E-poçta ýa-da parol ýalňyş!" : "E-posta veya şifre hatalı!";
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> ${currentLang === 'tk' ? 'Girmek' : 'Giriş Yap'}`;
            }
        });

        // Çykyş etmek (Logout)
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Çykyşda ýalňyşlyk:", error);
            }
        });

        const form = document.getElementById('addProductForm');
        const statusMsg = document.getElementById('statusMessage');
        const listContainer = document.getElementById('adminProductsList');
        const imageFileInput = document.getElementById('imageFile');
        const prodImageInput = document.getElementById('prodImage');

        imageFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    prodImageInput.value = event.target.result;
                    statusMsg.style.color = "#22c55e";
                    statusMsg.innerHTML = currentLang === 'tk' ? "✓ Surat üstünlikli saýlandy!" : "✓ Görsel başarıyla seçildi!";
                }
                reader.readAsDataURL(file);
            }
        });

        async function fetchAdminProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">${currentLang === 'tk' ? 'Heniz bellige alnan önüm ýok.' : 'Henüz kayıtlı ürün yok.'}</td></tr>`;
                    return;
                }

                listContainer.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const prod = documentSnap.data();
                    const id = documentSnap.id;
                    listContainer.innerHTML += `
                        <tr>
                            <td>
                                <div class="prod-thumb-container" onclick="openModal('${prod.image}')">
                                    <img src="${prod.image}" class="prod-thumb" alt="">
                                </div>
                            </td>
                            <td><strong>${prod.title}</strong></td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteProduct('${id}')"><i class="fas fa-trash"></i> ${currentLang === 'tk' ? 'Poz' : 'Sil'}</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Ýalňyşlyk:", error);
                listContainer.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ef4444;">Hata oluştu.</td></tr>`;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('prodTitle').value;
            const image = prodImageInput.value;
            const description = document.getElementById('prodDesc').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${currentLang === 'tk' ? 'Işlenilýär...' : 'İşleniyor...'}`;

            try {
                await addDoc(collection(db, "products"), {
                    title: title,
                    image: image,
                    description: description,
                    createdAt: new Date()
                });
                statusMsg.style.color = "#22c55e";
                statusMsg.innerHTML = currentLang === 'tk' ? "✓ Önüm üstünlikli goşuldy!" : "✓ Ürün başarıyla eklendi!";
                form.reset();
                fetchAdminProducts();
            } catch (error) {
                console.error("Ýalňyşlyk:", error);
                statusMsg.style.color = "#ef4444";
                statusMsg.innerHTML = "✕ Hata oluştu!";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fas fa-upload"></i> ${currentLang === 'tk' ? 'Önümi çap et' : 'Ürünü Yayınla'}`;
            }
        });

        window.deleteProduct = async function(id) {
            const confirmMsg = currentLang === 'tk' ? "Bu önümi pozmak isleýärsiňizmi?" : "Bu ürünü silmek istediğinize emin misiniz?";
            if (confirm(confirmMsg)) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    alert(currentLang === 'tk' ? "Pozuldy!" : "Silindi!");
                    fetchAdminProducts();
                } catch (error) {
                    alert("Hata oluştu.");
                }
            }
        }

        // Sargytlar we Müşderiler Üçin Firebase Funksiýalary
        const orderForm = document.getElementById('addOrderForm');
        const ordersListContainer = document.getElementById('adminOrdersList');

        async function fetchAdminOrders() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                if (querySnapshot.empty) {
                    ordersListContainer.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">${currentLang === 'tk' ? 'Hasaba alnan sargyt ýok.' : 'Kayıtlı sipariş yok.'}</td></tr>`;
                    return;
                }

                ordersListContainer.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const ord = documentSnap.data();
                    const id = documentSnap.id;
                    const kalan = Number(ord.price) - Number(ord.paid);
                    
                    ordersListContainer.innerHTML += `
                        <tr>
                            <td><strong>${ord.name}</strong><br><small style="color:var(--text-muted);">${ord.phone}</small></td>
                            <td>${ord.item}</td>
                            <td>
                                <span style="color:var(--accent-color);">${ord.price} TL</span><br>
                                <small style="color:#22c55e;">${currentLang === 'tk' ? 'Alnan' : 'Ödenen'}: ${ord.paid} TL</small><br>
                                <small style="color:#ef4444;">${currentLang === 'tk' ? 'Galgan' : 'Kalan'}: ${kalan} TL</small>
                            </td>
                            <td>${ord.status}</td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteOrder('${id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Ýalňyşlyk:", error);
            }
        }

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const item = document.getElementById('orderItem').value;
            const price = document.getElementById('orderPrice').value;
            const paid = document.getElementById('orderPaid').value;
            const status = document.getElementById('orderStatus').value;

            try {
                await addDoc(collection(db, "orders"), {
                    name: name,
                    phone: phone,
                    item: item,
                    price: price,
                    paid: paid,
                    status: status,
                    createdAt: new Date()
                });
                alert(currentLang === 'tk' ? "Sargyt üstünlikli goşuldy!" : "Sipariş başarıyla eklendi!");
                orderForm.reset();
                fetchAdminOrders();
            } catch (error) {
                alert("Hata oluştu / Ýalňyşlyk ýüze çykdy.");
            }
        });

        window.deleteOrder = async function(id) {
            const confirmMsg = currentLang === 'tk' ? "Bu sargydy pozmak isleýärsiňizmi?" : "Bu siparişi silmek istediğinize emin misiniz?";
            if (confirm(confirmMsg)) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                    fetchAdminOrders();
                } catch (error) {
                    alert("Hata oluştu.");
                }
            }
        }
    </script>
</body>
</html>
